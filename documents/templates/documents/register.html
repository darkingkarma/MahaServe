
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahaServe | Create Account</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #17233c;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #14284b12;
        }

        .brand {
            color: #14284b;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64718a;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7ddea;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #b8c9ec;
            border-color: #294d85;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #14284b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #203d6b; }

        .messages {
            padding: 11px;
            border-radius: 7px;
            background: #fff1f0;
            color: #a12622;
            font-size: 14px;
            margin: 12px 0;
        }

        .links {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            line-height: 2;
        }

        a { color: #244e89; }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64718a;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="brand">MahaServe</div>
        <p class="subtitle">Create your resident account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="messages">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                maxlength="150"
                autocomplete="username"
                required
            >

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <div class="links">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </div>

        <a class="back" href="/">← Back to landing page</a>
    </main>
</body>
</html>
